# Repository policy: credentials are never committed. Use the default gitleaks
# ruleset without path-wide exceptions; test fixtures use UUID secret pointers and
# deliberately non-credential strings.

[extend]
useDefault = true

[allowlist]
description = "Exact fake secret pointer retained in immutable test history"
regexes = [
  # A Paperclip secret ID is a UUID pointer, not a credential value. Older
  # merged tests use this exact fake pointer, so exempt only that captured value;
  # every other credential-shaped string and UUID remains scanned.
  '''^3f2504e0-4f89-41d3-9a0c-0305e82c3301$''',
]
