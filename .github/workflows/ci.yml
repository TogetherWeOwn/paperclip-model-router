name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TOG-2547: this used to be three separate jobs — "verify", "packaged-artifact"
  # and "version-sync" — each paying its own checkout + setup-node + npm ci before
  # doing 5-30s of real work. GitHub Actions bills per JOB, rounded up to the
  # nearest whole minute (see billing docs on minute multipliers): three
  # sub-minute jobs bill 3 minutes even though the combined work is under a
  # minute. Folding them into one sequential job keeps every check (nothing here
  # was removed) and turns 3 billed minutes into 1. Order is fast-fail-first:
  # typecheck/test/build before the slower pack-and-install step, so a broken
  # build never pays for a tarball nobody can now trust anyway.
  verify:
    name: typecheck, test, build, package, version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The host loads exactly these two files. A build that does not produce
      # them installs and then fails at worker start, which is a much worse
      # place to find out.
      - name: Assert the runtime entrypoints exist
        run: test -f dist/manifest.js && test -f dist/worker.js

      # Validate the BUILT artifact with the host's own install-time validators
      # (`pluginManifestV1Schema` and the Ajv config validator), so a manifest
      # or config schema the host would reject fails here rather than at
      # install time on a live instance.
      - name: Validate against the host's install-time schemas
        run: npm run verify:host

      # A release is pinned by version, so package.json, the manifest constant
      # and the changelog must agree before anything is tagged.
      - name: package.json version is in the changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          grep -q "## \[$version\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          grep -q "PLUGIN_VERSION = \"$version\"" src/constants.ts \
            || { echo "src/constants.ts PLUGIN_VERSION is not $version"; exit 1; }

      # `npm run verify` checks the working tree. This checks what an operator
      # actually installs: pack, unpack somewhere clean, install runtime deps,
      # and load both entrypoints. The SDK is deliberately external to the
      # bundle, so a tarball that ships `dist/` without its dependency resolves
      # to ERR_MODULE_NOT_FOUND at worker start — which is a terrible place to
      # find out. Reuses the `npm ci` and `npm run build` already done above
      # instead of re-running them in a fresh job.
      # TOG-2941: this step used to unpack into a hard-coded `/tmp/installed` and
      # glob `artifacts/*.tgz`. On `ubuntu-latest` both were safe by construction
      # — every job got a fresh VM. The self-hosted runners are persistent, so a
      # path outside the workspace survives into the next job on the same box and
      # `actions/checkout`'s clean never sees it: two runs could share, or read,
      # each other's tarball. Unpack into a run-unique directory instead, and
      # name the tarball rather than globbing, so the artifact this step loads is
      # always the one this run just packed.
      - name: Pack, unpack, install runtime deps, load
        env:
          INSTALL_DIR: ${{ runner.temp }}/installed-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rm -rf artifacts "$INSTALL_DIR"
          mkdir -p artifacts "$INSTALL_DIR"
          tarball="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-') + '-' + p.version + '.tgz'")"
          npm pack --pack-destination ./artifacts
          test -f "artifacts/$tarball" || { echo "npm pack did not produce artifacts/$tarball"; ls -A artifacts; exit 1; }
          tar -xzf "artifacts/$tarball" -C "$INSTALL_DIR" --strip-components=1
          cd "$INSTALL_DIR"
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "
            const root = process.env.INSTALL_DIR;
            const manifest = (await import(root + '/dist/manifest.js')).default;
            const worker = await import(root + '/dist/worker.js');
            if (typeof worker.default?.definition?.setup !== 'function') {
              throw new Error('packed worker has no setup handler');
            }
            console.log('packed artifact loads:', manifest.id, 'v' + manifest.version);
          "

      # Persistent runners keep whatever the job leaves behind, so clean up even
      # when the step above failed.
      - name: Remove the unpacked artifact
        if: always()
        run: rm -rf "${{ runner.temp }}/installed-${{ github.run_id }}-${{ github.run_attempt }}"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks *Action* requires a paid licence for organizations. The
      # scanner itself is open source, so run the pinned binary directly —
      # same scan, no licence server in the critical path of every push.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan the full history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
