name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The host loads exactly these two files. A build that does not produce
      # them installs and then fails at worker start, which is a much worse
      # place to find out.
      - name: Assert the runtime entrypoints exist
        run: test -f dist/manifest.js && test -f dist/worker.js

      # Validate the BUILT artifact with the host's own install-time validators
      # (`pluginManifestV1Schema` and the Ajv config validator), so a manifest
      # or config schema the host would reject fails here rather than at
      # install time on a live instance.
      - name: Validate against the host's install-time schemas
        run: npm run verify:host

  version-sync:
    name: version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A release is pinned by version, so package.json, the manifest constant
      # and the changelog must agree before anything is tagged.
      - name: package.json version is in the changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          grep -q "## \[$version\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          grep -q "PLUGIN_VERSION = \"$version\"" src/constants.ts \
            || { echo "src/constants.ts PLUGIN_VERSION is not $version"; exit 1; }

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks *Action* requires a paid licence for organizations. The
      # scanner itself is open source, so run the pinned binary directly —
      # same scan, no licence server in the critical path of every push.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan the full history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
