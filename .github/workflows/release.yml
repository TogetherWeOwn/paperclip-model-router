name: Release

# A company is pinned to a version, so a release must be a reproducible
# artifact, not a branch. Tag `vX.Y.Z` on a green main and this builds, verifies
# that the tag matches package.json, and publishes the tarball as a release
# asset that `paperclipai plugin install` can consume.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-run the release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [ -n "${{ github.event.inputs.tag }}" ] && tag="${{ github.event.inputs.tag }}" && tag="${tag#v}"
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "$version" ] \
            || { echo "tag $tag does not match package.json version $version"; exit 1; }

      - name: Verify
        run: npm run verify

      # --pack-destination does not create the directory.
      - name: Pack
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts
          ls -l artifacts

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
