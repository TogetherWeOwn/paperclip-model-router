name: PR lint

# Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#     This repo is public: no internal ticket id, instance link, localhost or private host
#     in the title, body, commit message or branch name. Say it in plain words and link
#     only public GitHub issues (`Fixes #123`).
#   * PR body uses `.github/pull_request_template.md` and fills in every section.
#   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
#     main is one conventional commit per PR. The push lint below flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).
# Full rules: CONTRIBUTING.md, "Pull request standards".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  REQUIRE_CARD_REF: "false"
  PR_STANDARDS_MODE: "warn"

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - name: Unit-test the lint
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_standards.py'
      - name: Check title, body, branch and commits
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 .github/scripts/pr_standards.py
